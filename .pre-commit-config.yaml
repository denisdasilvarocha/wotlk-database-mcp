# Git hooks, run by prek (https://prek.j178.dev). Install with `just setup`.
# Stages: fast checks on commit, slow checks on push, everything on `just check` (manual stage).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: builtin
    hooks:
      - { id: check-added-large-files, stages: [pre-commit, manual] }
      - { id: check-merge-conflict, stages: [pre-commit, manual] }
      - { id: check-toml, stages: [pre-commit, manual] }
      - { id: check-yaml, stages: [pre-commit, manual] }
      - { id: detect-private-key, stages: [pre-commit, manual] }
      - { id: end-of-file-fixer, stages: [pre-commit, manual] }
      - { id: mixed-line-ending, args: [--fix=lf], stages: [pre-commit, manual] }
      - { id: trailing-whitespace, stages: [pre-commit, manual] }

  # Cargo checks always run on the whole crate: a change in one file can break another.
  - repo: local
    hooks:
      - id: fmt
        name: format (rustfmt, taplo)
        entry: just fmt-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
      - id: lint
        name: lint (clippy)
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
      - id: test
        name: test
        entry: just test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
      - id: doc
        name: doc (rustdoc)
        entry: just doc
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
      - id: deps
        name: dependencies (cargo-deny, cargo-shear)
        entry: just deps
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
