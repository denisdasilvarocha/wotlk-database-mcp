# cargo-release settings: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
allow-branch = ["main"]
# One package is released; per-package commits let the message use {{version}}.
consolidate-commits = false
pre-release-commit-message = "chore(release): {{version}}"
tag-message = "{{tag_name}}"

# Stable releases move Unreleased into a dated section. Pre-releases leave CHANGELOG.md unchanged.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = '^## \[Unreleased\]$', replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  # Later releases: compare from the previous tag. Must run before the first-release rule.
  { file = "CHANGELOG.md", search = '^\[Unreleased\]: \S+/compare/(\S+)\.\.\.HEAD$', replace = "[Unreleased]: {{repository}}/compare/{{tag_name}}...HEAD\n[{{version}}]: {{repository}}/compare/${1}...{{tag_name}}", min = 0, max = 1 },
  # First release: no previous tag exists.
  { file = "CHANGELOG.md", search = '^\[Unreleased\]: \S+/commits/main$', replace = "[Unreleased]: {{repository}}/compare/{{tag_name}}...HEAD\n[{{version}}]: {{repository}}/releases/tag/{{tag_name}}", min = 0, max = 1 },
  # Fail before writing if neither link rule matched.
  { file = "CHANGELOG.md", search = '^\[Unreleased\]: \S+/compare/\S+\.\.\.HEAD$', replace = "$0", exactly = 1 },
]
