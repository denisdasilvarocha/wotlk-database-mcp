[workspace]
members = ["builder"]
resolver = "3"

[package]
name = "wotlk-database-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "MCP server for the World of Warcraft: Wrath of the Lich King database"
repository = "https://github.com/denisdasilvarocha/wotlk-database-mcp"
publish = false

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "hooks", "limits"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.3"

[dev-dependencies]
rmcp = { version = "3.8.0", features = ["client"] }
tokio = { version = "1.54.1", features = ["io-util", "time"] }
wotlk-db-builder = { version = "0.1.0", path = "builder" }
wow_dbc = { version = "0.3.0", features = ["wrath"] }
wow_world_base = { version = "0.2.0", features = ["wrath"] }

[lints]
workspace = true

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints picked individually; the group as a whole is not meant to be enabled.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
# stdout carries MCP JSON-RPC frames; any stray print corrupts the protocol. Log with `tracing`.
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[package.metadata.dist]
dist = true

[profile.dist]
inherits = "release"
lto = "thin"
