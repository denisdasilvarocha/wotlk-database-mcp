name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: read

jobs:
  merge:
    if: >-
      github.repository == 'denisdasilvarocha/wotlk-database-mcp' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The privileged workflow never checks out or executes pull request code.
      - name: Merge the tested Dependabot pull request and start Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          state=open
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            state=all
          fi
          pulls=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f "state=$state" -f base=main -f "head=${GH_REPO%%/*}:$HEAD_BRANCH" -F per_page=100)
          pull=$(jq -c --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
            [.[] | select(
              .user.login == "dependabot[bot]" and
              .head.sha == $sha and .head.repo.full_name == $repo and
              .base.repo.full_name == $repo and .base.ref == "main" and
              .draft == false and (.state == "open" or .merged_at != null)
            )] |
            if length == 1 then .[0]
            elif length == 0 then empty
            else error("multiple matching pull requests") end' <<< "$pulls")
          if [[ -z "$pull" ]]; then
            echo "No eligible Dependabot pull request matches the tested commit."
            exit 0
          fi

          number=$(jq -r '.number' <<< "$pull")
          if jq -e '.state == "open"' <<< "$pull" >/dev/null; then
            # The merge API pins the PR head. The ruleset enforces base freshness at merge time.
            rules=$(gh api "repos/$GH_REPO/rules/branches/main")
            if ! jq -e 'any(.[];
              .type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy == true and
              (.parameters.required_status_checks | length > 0)
            )' <<< "$rules" >/dev/null; then
              echo "::warning::Dependabot auto-merge requires an active ruleset with up-to-date status checks on main."
              exit 0
            fi

            gh pr checks "$number" --watch --fail-fast
            if ! gh api --method PUT "repos/$GH_REPO/pulls/$number/merge" \
              -f "sha=$HEAD_SHA" -f merge_method=squash | jq -e '.merged == true' >/dev/null; then
              if [[ "$(gh pr view "$number" --json mergeStateStatus --jq '.mergeStateStatus')" == BEHIND ]]; then
                echo "::error::Dependabot PR #$number is behind main. Comment '@dependabot rebase' on the PR and wait for CI on the new head."
              fi
              exit 1
            fi
          else
            # Recover a failed dispatch after this workflow's token merged the PR.
            merged=$(gh api "repos/$GH_REPO/pulls/$number")
            if ! jq -e '.merged == true and .merged_by.login == "github-actions[bot]"' <<< "$merged" >/dev/null; then
              echo "The matching pull request was closed without a workflow merge."
              exit 0
            fi
          fi

          # GITHUB_TOKEN merges do not emit a push event that starts Release.
          gh api --method POST "repos/$GH_REPO/dispatches" -f event_type=dependabot-merged
