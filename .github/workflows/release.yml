# Changesets owns npm versions and releases. Binary jobs run only for a publish
# plan, and publish is gated on all five platform smoke tests and packing.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    if: github.repository == 'denisdasilvarocha/wotlk-database-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Changesets CLI
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Changesets CLI
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  verify:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build-native:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    name: Build and smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - os: windows-2022
            platform: win32-x64
            target: x86_64-pc-windows-msvc
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Embed immutable database checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          schema=$(sed -nE 's/^pub const SCHEMA_VERSION: u32 = ([0-9]+);$/\1/p' src/schema_version.rs)
          [[ "$schema" =~ ^[0-9]+$ ]]
          tag="db-schema${schema}"
          base="wotlk-db-schema${schema}.sqlite"
          assets=$(mktemp)
          if ! gh release view "$tag" --json assets --jq '.assets[].name' > "$assets" 2>/dev/null; then
            echo "::error::Database release $tag was not found. Run the Release database workflow from main first." >&2
            exit 1
          fi
          if ! grep -Fxq "$base.zst" "$assets" || ! grep -Fxq "$base.sha256" "$assets"; then
            echo "::error::Database release $tag must contain both $base.zst and $base.sha256. Run the Release database workflow from main first." >&2
            exit 1
          fi
          checksum_dir=$(mktemp -d)
          gh release download "$tag" --pattern "$base.sha256" --dir "$checksum_dir"
          checksum=$(cat "$checksum_dir/$base.sha256")
          expected_suffix="  $base"
          hash=${checksum%% *}
          [[ "$hash" =~ ^[0-9a-f]{64}$ && "$checksum" == "$hash$expected_suffix" ]] || {
            echo "::error::Invalid checksum asset in database release $tag" >&2
            exit 1
          }
          echo "WOTLK_DB_SHA256=$hash" >> "$GITHUB_ENV"
      - name: Build native binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
      - name: Stage, pack, and smoke-test launcher and host
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/wotlk-database-mcp"
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          node npm/build.mjs "$PLATFORM=$binary"
          mkdir -p "$RUNNER_TEMP/npm-packed" "$RUNNER_TEMP/npm-smoke"
          printf '{"private":true}\n' > "$RUNNER_TEMP/npm-smoke/package.json"
          pnpm --filter wotlk-database-mcp pack --pack-destination "$RUNNER_TEMP/npm-packed"
          pnpm --filter "wotlk-database-mcp-$PLATFORM" pack --pack-destination "$RUNNER_TEMP/npm-packed"
          npm install --prefix "$RUNNER_TEMP/npm-smoke" --ignore-scripts --no-audit --no-fund --offline "$RUNNER_TEMP"/npm-packed/*.tgz
          node npm/smoke.mjs "$RUNNER_TEMP/npm-smoke"
      - name: Upload raw native binary for package assembly
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/wotlk-database-mcp"
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          mkdir -p "$RUNNER_TEMP/native"
          cp "$binary" "$RUNNER_TEMP/native/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 1

  pack:
    needs:
      - select-mode
      - build-native
      - verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Changesets CLI
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
      - name: Stage all native binaries
        run: |
          set -euo pipefail
          node npm/build.mjs \
            "darwin-arm64=$RUNNER_TEMP/native/native-darwin-arm64/wotlk-database-mcp" \
            "darwin-x64=$RUNNER_TEMP/native/native-darwin-x64/wotlk-database-mcp" \
            "linux-arm64=$RUNNER_TEMP/native/native-linux-arm64/wotlk-database-mcp" \
            "linux-x64=$RUNNER_TEMP/native/native-linux-x64/wotlk-database-mcp" \
            "win32-x64=$RUNNER_TEMP/native/native-win32-x64/wotlk-database-mcp.exe"
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Changesets CLI
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
