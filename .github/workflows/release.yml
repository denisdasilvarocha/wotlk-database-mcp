# Changesets owns npm versions and releases. Binary jobs run only for a publish
# plan, and publish is gated on all five platform smoke tests and packing.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'denisdasilvarocha/wotlk-database-mcp'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - if: steps.select-mode.outputs.mode == 'version'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  database:
    needs: verify
    uses: ./.github/workflows/release-database.yml
    permissions:
      contents: write

  build-native:
    needs: [prepare, database]
    if: needs.prepare.outputs.mode == 'publish'
    name: Build and smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      WOTLK_DB_SHA256: ${{ needs.database.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - os: windows-2022
            platform: win32-x64
            target: x86_64-pc-windows-msvc
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
      - name: Set up Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build native binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
      - uses: ./.github/actions/npm-smoke
        with:
          binary: target/${{ matrix.target }}/release/wotlk-database-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/wotlk-database-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  pack:
    needs: [prepare, build-native]
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
      - name: Stage all native binaries
        run: |
          set -euo pipefail
          node npm/build.mjs \
            "darwin-arm64=$RUNNER_TEMP/native/native-darwin-arm64/wotlk-database-mcp" \
            "darwin-x64=$RUNNER_TEMP/native/native-darwin-x64/wotlk-database-mcp" \
            "linux-arm64=$RUNNER_TEMP/native/native-linux-arm64/wotlk-database-mcp" \
            "linux-x64=$RUNNER_TEMP/native/native-linux-x64/wotlk-database-mcp" \
            "win32-x64=$RUNNER_TEMP/native/native-win32-x64/wotlk-database-mcp.exe"
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.prepare.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-packages
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
