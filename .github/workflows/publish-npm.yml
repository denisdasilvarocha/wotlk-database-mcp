name: Publish npm packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Packed release smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            format: tar.xz
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            format: tar.xz
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
            format: tar.xz
          - os: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
            format: tar.xz
          - os: windows-2022
            platform: win32-x64
            target: x86_64-pc-windows-msvc
            format: zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: dist-archives
      - name: Pack, install without scripts, and list MCP tools
        env:
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
          SOURCE: ${{ matrix.platform }}=dist-archives/wotlk-database-mcp-${{ matrix.target }}.${{ matrix.format }}
        run: |
          node npm/build.mjs "$VERSION" packed "$SOURCE"
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          npm install --prefix "$RUNNER_TEMP/npm-smoke" --ignore-scripts --no-audit --no-fund --offline "$PWD"/packed/*.tgz
          node npm/smoke.mjs "$RUNNER_TEMP/npm-smoke"

  publish:
    needs: smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-build-local-*
          path: dist-archives
          merge-multiple: true
      - name: Pack all packages
        env:
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
        run: |
          node npm/build.mjs "$VERSION" packed \
            darwin-arm64=dist-archives/wotlk-database-mcp-aarch64-apple-darwin.tar.xz \
            darwin-x64=dist-archives/wotlk-database-mcp-x86_64-apple-darwin.tar.xz \
            linux-x64=dist-archives/wotlk-database-mcp-x86_64-unknown-linux-gnu.tar.xz \
            linux-arm64=dist-archives/wotlk-database-mcp-aarch64-unknown-linux-gnu.tar.xz \
            win32-x64=dist-archives/wotlk-database-mcp-x86_64-pc-windows-msvc.zip
      # Configure all six npm names to trust the calling workflow release.yml,
      # owner denisdasilvarocha, repository wotlk-database-mcp, allowing npm publish.
      - name: Publish platform packages, then launcher
        shell: bash
        env:
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
        # `./` is required: npm reads `packed/<file>` as the GitHub shorthand `github:packed/<file>`.
        run: |
          set -euo pipefail
          tag=latest
          if [[ "$VERSION" == *-* ]]; then tag=next; fi
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm publish "./packed/wotlk-database-mcp-${platform}-${VERSION}.tgz" --access public --tag "$tag"
          done
          npm publish "./packed/wotlk-database-mcp-${VERSION}.tgz" --access public --tag "$tag"
